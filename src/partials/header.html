<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}} | {{name}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}/{{canonical}}">
<meta property="og:title" content="{{title}} | {{name}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="{{url}}/img/logo.jpg">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0f0e0e">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap">
<link rel="stylesheet" href="css/styles.css">
{{head_extra}}
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"AutoDealer","name":"{{name}}","url":"{{url}}","telephone":"{{phone_tel}}","email":"{{email}}","image":"{{url}}/img/logo.jpg","slogan":"{{tagline}}","areaServed":[{"@type":"State","name":"New York"},{"@type":"State","name":"New Jersey"},{"@type":"State","name":"Pennsylvania"}]}
</script>
</head>
<body class="{{body_class}}">
<a class="skip" href="#main">Skip to content</a>

<div class="topbar"><div class="container">
  <span class="topbar__area">Worldwide · Serving NY · NJ · PA</span>
  <span class="topbar__links">
    <a href="tel:{{phone_tel}}">{{phone}}</a>
    <span class="topbar__sep" aria-hidden="true">·</span>
    <a href="sms:{{phone_tel}}">Text us</a>
    <span class="topbar__sep" aria-hidden="true">·</span>
    <span>{{hours}}</span>
  </span>
</div></div>

<header class="site-header" id="site-header"><div class="container">
  <a class="brand" href="index.html" aria-label="{{name}} home">
    <img src="img/logo.jpg" alt="{{name}}" width="488" height="135">
  </a>
  <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>
  <nav class="site-nav" id="site-nav" aria-label="Main"><ul class="nav">
    <li><a href="vehicles.html"{{nav_vehicles}}>Vehicles</a></li>
    <li><a href="specials.html"{{nav_specials}}>Specials</a></li>
    <li><a href="custom-quote.html"{{nav_custom_quote}}>Custom Quote</a></li>
    <li><a href="reviews.html"{{nav_reviews}}>Reviews</a></li>
    <li><a href="why-us.html"{{nav_why_us}}>Why Us?</a></li>
    <li><a class="btn btn--primary btn--sm nav__cta" href="credit-app.html"{{nav_credit_app}}>Credit App</a></li>
  </ul></nav>
</div></header>

<main id="main">
